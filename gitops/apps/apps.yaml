apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-components
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-username/gitops.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
