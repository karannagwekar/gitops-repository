apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-east
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/karannagwekar/gitops-repository
    targetRevision: deployment
    path: gitops/apps/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - RespectIgnoreDifferences=true
  ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
