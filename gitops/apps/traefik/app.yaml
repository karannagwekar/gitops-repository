apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 2.11.2
    helm:
      values: |
        service:
          type: LoadBalancer
        logs:
          general:
            level: INFO
          access:
            enabled: true
        ports:
          web:
            expose: true
          websecure:
            expose: true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
