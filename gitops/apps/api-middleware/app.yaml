apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-middleware
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/gitops-repository
    targetRevision: main
    path: gitops/apps/api-middleware
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
