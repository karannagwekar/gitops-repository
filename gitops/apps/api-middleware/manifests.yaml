---
apiVersion: v1
kind: Namespace
metadata:
  name: api-middleware
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-middleware
  namespace: api-middleware
  labels:
    app: api-middleware
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-middleware
  template:
    metadata:
      labels:
        app: api-middleware
        version: v1
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
      - name: api-middleware
        image: kennethreitz/httpbin:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: PORT
          value: "80"
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /get
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /get
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: api-middleware
  namespace: api-middleware
  labels:
    app: api-middleware
spec:
  type: ClusterIP
  selector:
    app: api-middleware
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-middleware
  namespace: api-middleware
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-middleware
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
