apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
# Dev mode Vault pod
apiVersion: v1
kind: Pod
metadata:
  name: vault-dev
  namespace: vault
  labels:
    app: vault
spec:
  containers:
  - name: vault
    image: hashicorp/vault:1.19.0
    args:
      - "server"
      - "-dev"
      - "-dev-root-token-id=root"
    ports:
      - containerPort: 8200
        name: http
      - containerPort: 8201
        name: cluster
---
# NodePort service to access Vault UI/API
apiVersion: v1
kind: Service
metadata:
  name: vault-ui
  namespace: vault
spec:
  type: NodePort
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
      nodePort: 30080
      name: http
